<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Heraldic Shield -->
  <path d="M256 78
           C180 78 120 140 120 215
           C120 310 170 395 256 458
           C342 395 392 310 392 215
           C392 140 332 78 256 78 Z"
        fill="#ffffff"
        stroke="url(#gold)"
        stroke-width="8"/>

  <!-- Inner shield border -->
  <path d="M256 106
           C196 106 148 160 148 222
           C148 306 190 380 256 434
           C322 380 364 306 364 222
           C364 160 316 106 256 106 Z"
        fill="none"
        stroke="#1e3a8a"
        stroke-width="2.5"
        opacity="0.35"/>

  <!-- LION HEAD (minimal vector) -->
  <g transform="translate(256 248)">
    <!-- Mane outer -->
    <path d="M0 -138
             C -92 -138 -148 -78 -150 -20
             C -164 12 -158 56 -130 80
             C -128 120 -82 152 -32 154
             C -18 176 18 176 32 154
             C 82 152 128 120 130 80
             C 158 56 164 12 150 -20
             C 148 -78 92 -138 0 -138 Z"
          fill="url(#gold)"/>

    <!-- Mane dark shade -->
    <path d="M0 -120
             C -76 -120 -128 -70 -130 -16
             C -142 14 -136 52 -112 74
             C -110 108 -70 136 -28 138
             L -14 154
             C -62 152 -106 122 -108 84
             C -132 62 -138 28 -126 2
             C -126 -42 -84 -86 -36 -86
             Z"
          fill="#92400e"
          opacity="0.55"/>

    <!-- Face -->
    <path d="M 0 -92
             C -66 -92 -108 -52 -108 -6
             C -108 52 -64 116 0 116
             C 64 116 108 52 108 -6
             C 108 -52 66 -92 0 -92 Z"
          fill="#f59e0b"/>

    <!-- Face light -->
    <path d="M -82 -20
             C -86 -60 -52 -88 -14 -88
             C 12 -88 40 -74 56 -50
             C 24 -58 -10 -58 -46 -42
             C -62 -34 -76 -28 -82 -20 Z"
          fill="#fde68a"
          opacity="0.7"/>

    <!-- Ears -->
    <path d="M -82 -78
             L -58 -118
             L -34 -86
             C -52 -80 -70 -80 -82 -78 Z"
          fill="#92400e"/>
    <path d="M 82 -78
             L 58 -118
             L 34 -86
             C 52 -80 70 -80 82 -78 Z"
          fill="#92400e"/>
    <path d="M -70 -88
             L -56 -112
             L -46 -92 Z"
          fill="#fbbf24"/>
    <path d="M 70 -88
             L 56 -112
             L 46 -92 Z"
          fill="#fbbf24"/>

    <!-- Eyes -->
    <ellipse cx="-38" cy="-24" rx="14" ry="18" fill="#ffffff"/>
    <ellipse cx="38" cy="-24" rx="14" ry="18" fill="#ffffff"/>
    <circle cx="-34" cy="-18" r="8" fill="#0f172a"/>
    <circle cx="42" cy="-18" r="8" fill="#0f172a"/>
    <circle cx="-31" cy="-20" r="2.4" fill="#ffffff"/>
    <circle cx="45" cy="-20" r="2.4" fill="#ffffff"/>

    <!-- Brow / fierce -->
    <path d="M -70 -54
             C -56 -70 -22 -70 -10 -58
             L -16 -46
             C -30 -56 -54 -56 -68 -44 Z"
          fill="#78350f"/>
    <path d="M 70 -54
             C 56 -70 22 -70 10 -58
             L 16 -46
             C 30 -56 54 -56 68 -44 Z"
          fill="#78350f"/>

    <!-- Nose -->
    <path d="M -14 18
             L 14 18
             C 22 18 26 26 20 32
             C 10 42 0 38 0 38
             C 0 38 -10 42 -20 32
             C -26 26 -22 18 -14 18 Z"
          fill="#0f172a"/>
    <!-- Muzzle light -->
    <path d="M -40 30
             C -50 6 -22 -14 0 -14
             C 22 -14 50 6 40 30
             C 34 52 10 68 0 68
             C -10 68 -34 52 -40 30 Z"
          fill="#fef3c7"
          opacity="0.85"/>

    <!-- Mouth / whisker area -->
    <path d="M 0 38
             C 0 52 -10 66 -26 68"
          stroke="#0f172a"
          stroke-width="3"
          stroke-linecap="round"
          fill="none"/>
    <path d="M 0 38
             C 0 52 10 66 26 68"
          stroke="#0f172a"
          stroke-width="3"
          stroke-linecap="round"
          fill="none"/>

    <!-- Fangs -->
    <path d="M -14 68 L -16 90 L -8 80 Z" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    <path d="M 14 68 L 16 90 L 8 80 Z" fill="#ffffff" stroke="#78350f" stroke-width="1"/>

    <!-- Whisker dots -->
    <circle cx="-48" cy="28" r="2.2" fill="#0f172a"/>
    <circle cx="-52" cy="40" r="2.2" fill="#0f172a"/>
    <circle cx="-48" cy="52" r="2.2" fill="#0f172a"/>
    <circle cx="48" cy="28" r="2.2" fill="#0f172a"/>
    <circle cx="52" cy="40" r="2.2" fill="#0f172a"/>
    <circle cx="48" cy="52" r="2.2" fill="#0f172a"/>

    <!-- Mane tuft on top -->
    <path d="M -28 -130
             C -20 -162 20 -162 28 -130
             C 16 -148 -16 -148 -28 -130 Z"
          fill="#b45309"/>
  </g>

  <!-- Brand banner at bottom -->
  <rect x="48" y="416" width="416" height="64" rx="18" fill="#ffffff" opacity="0.95"/>
  <text x="256" y="460"
        font-family="'Georgia','Times New Roman',serif"
        font-size="38"
        font-weight="800"
        fill="#0f172a"
        text-anchor="middle"
        letter-spacing="2">
    ASADBEK POSTS
  </text>
</svg>
