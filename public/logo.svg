<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded square background (soft corners like user image) -->
  <rect x="24" y="24" width="464" height="464" rx="124" ry="124" fill="#ffffff"/>
  <!-- Subtle drop outer frame -->
  <rect x="24" y="24" width="464" height="464" rx="124" ry="124" fill="none" stroke="#0f172a" stroke-width="2.5" opacity="0.08"/>

  <!-- ============ LINE-ART LION HEAD (STROKE STYLE) ============ -->
  <g transform="translate(256 266)" fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- ===== Outer shield-like top mane arcs ===== -->
    <g stroke-width="18">
      <path d="M 0 -188
               C -116 -188 -198 -98 -198 28"/>
      <path d="M 0 -188
               C 116 -188 198 -98 198 28"/>
      <!-- Left outer wave -->
      <path d="M -198 28
               C -198 108 -148 164 -88 174
               C -108 140 -120 100 -120 58"/>
      <!-- Right outer wave -->
      <path d="M 198 28
               C 198 108 148 164 88 174
               C 108 140 120 100 120 58"/>

      <!-- Inner mane waves (flowy) -->
      <path d="M -144 -48
               C -156 -100 -96 -156 -30 -158
               C -66 -132 -90 -100 -96 -60
               C -114 -56 -132 -52 -144 -48 Z"/>
      <path d="M 144 -48
               C 156 -100 96 -156 30 -158
               C 66 -132 90 -100 96 -60
               C 114 -56 132 -52 144 -48 Z"/>

      <!-- Top crest swirl (flowing hair on top) -->
      <path d="M -70 -170
               C -40 -212 40 -212 70 -170
               C 60 -204 20 -224 0 -220
               C -20 -224 -60 -204 -70 -170 Z"/>
      <path d="M -30 -216
               C 0 -240 16 -234 26 -222"/>

      <!-- Face frame round -->
      <path d="M 0 -128
               C -84 -128 -136 -72 -136 8
               C -136 82 -94 146 -40 156
               C -22 172 -6 182 0 196
               C 6 182 22 172 40 156
               C 94 146 136 82 136 8
               C 136 -72 84 -128 0 -128 Z"/>
    </g>

    <!-- ===== Ears (thick stroke) ===== -->
    <g stroke-width="16">
      <path d="M -104 -108
               L -76 -152
               L -46 -112
               L -64 -98
               L -84 -100 Z"/>
      <path d="M 104 -108
               L 76 -152
               L 46 -112
               L 64 -98
               L 84 -100 Z"/>
      <!-- Inner ear shadow -->
      <path d="M -90 -116
               L -78 -140
               L -62 -116" stroke-width="8"/>
      <path d="M 90 -116
               L 78 -140
               L 62 -116" stroke-width="8"/>
    </g>

    <!-- ===== Mane voluminous lower ===== -->
    <g stroke-width="14">
      <path d="M -124 82
               C -132 120 -122 158 -94 188"/>
      <path d="M 124 82
               C 132 120 122 158 94 188"/>
      <!-- Connecting swirls below chin -->
      <path d="M -94 188
               C -84 218 -46 238 -16 240
               C -56 224 -86 204 -94 188 Z"/>
      <path d="M 94 188
               C 84 218 46 238 16 240
               C 56 224 86 204 94 188 Z"/>
    </g>

    <!-- ===== Inner mane face swirls ===== -->
    <g stroke-width="8">
      <path d="M -112 -12
               C -108 -52 -82 -92 -40 -108"/>
      <path d="M 112 -12
               C 108 -52 82 -92 40 -108"/>
      <!-- Cheek mane flows -->
      <path d="M -116 24
               C -104 6 -88 -8 -68 -14"/>
      <path d="M 116 24
               C 104 6 88 -8 68 -14"/>
      <path d="M -108 68
               C -88 52 -62 44 -38 46"/>
      <path d="M 108 68
               C 88 52 62 44 38 46"/>
    </g>

    <!-- ===== EYES (almond shape outlined) ===== -->
    <g stroke-width="12">
      <path d="M -78 -36
               C -62 -56 -22 -54 -18 -34
               C -42 -40 -62 -30 -78 -36 Z"/>
      <path d="M 78 -36
               C 62 -56 22 -54 18 -34
               C 42 -40 62 -30 78 -36 Z"/>
    </g>
    <!-- Pupils (filled dot) -->
    <g fill="#000000">
      <circle cx="-44" cy="-42" r="7"/>
      <circle cx="44" cy="-42" r="7"/>
    </g>

    <!-- ===== BROWS / FIERCE ANGLED ===== -->
    <g stroke-width="14">
      <path d="M -100 -82
               C -74 -108 -36 -98 -26 -80
               L -36 -64
               C -64 -80 -88 -72 -100 -82 Z"/>
      <path d="M 100 -82
               C 74 -108 36 -98 26 -80
               L 36 -64
               C 64 -80 88 -72 100 -82 Z"/>
    </g>

    <!-- ===== MUZZLE / SNOUT (nose + mouth area outline) ===== -->
    <g stroke-width="12">
      <!-- Muzzle outer rounded rectangle -->
      <path d="M -60 18
               C -64 -18 -30 -46 0 -46
               C 30 -46 64 -18 60 18
               C 60 54 30 82 0 82
               C -30 82 -60 54 -60 18 Z"/>

      <!-- Nose (heart / spade style) -->
      <path d="M -24 6
               L 24 6
               L 0 34 Z"/>
      <path d="M -24 6
               C -34 -10 -16 -26 -4 -16
               C -8 -6 -14 0 -24 6 Z"/>
      <path d="M 24 6
               C 34 -10 16 -26 4 -16
               C 8 -6 14 0 24 6 Z"/>

      <!-- Mouth line -->
      <path d="M 0 58
               Q -22 78 -44 72"/>
      <path d="M 0 58
               Q 22 78 44 72"/>

      <!-- Center philtrum -->
      <path d="M 0 34
               L 0 58"/>
    </g>

    <!-- ===== FANGS ===== -->
    <g fill="#ffffff" stroke="#000000" stroke-width="7" stroke-linejoin="round">
      <path d="M -26 70 L -22 100 L -12 86 Z"/>
      <path d="M 26 70 L 22 100 L 12 86 Z"/>
    </g>

    <!-- ===== WHISKERS ===== -->
    <g stroke-width="5">
      <path d="M -58 20 L -112 4"/>
      <path d="M -58 40 L -116 40"/>
      <path d="M -58 58 L -112 76"/>

      <path d="M 58 20 L 112 4"/>
      <path d="M 58 40 L 116 40"/>
      <path d="M 58 58 L 112 76"/>
    </g>
    <!-- Whisker dots -->
    <g fill="#000000">
      <circle cx="-60" cy="18" r="3.5"/>
      <circle cx="-62" cy="38" r="3.5"/>
      <circle cx="-60" cy="58" r="3.5"/>
      <circle cx="60" cy="18" r="3.5"/>
      <circle cx="62" cy="38" r="3.5"/>
      <circle cx="60" cy="58" r="3.5"/>
    </g>
  </g>
</svg>
